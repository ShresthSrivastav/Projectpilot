services:
  ollama:
    image: ollama/ollama:latest
    container_name: projectpilot_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  backend:
    build: .
    container_name: projectpilot_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./generated_projects:/app/generated_projects
      - ./memory_store:/app/memory_store
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - BACKEND_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: .
    container_name: projectpilot_frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
