name: Terraform Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: terraform
    environment: ${{ github.event.inputs.environment || 'prod' }}

    outputs:
      has_changes: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write OCI API Key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="oci_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -var="oci_user_ocid=${{ secrets.OCI_USER_OCID }}" \
            -var="oci_fingerprint=${{ secrets.OCI_FINGERPRINT }}" \
            -var="oci_private_key_path=/home/runner/.oci/oci_api_key.pem" \
            -var="compartment_ocid=${{ secrets.COMPARTMENT_OCID }}" \
            -var="oci_region=${{ secrets.OCI_REGION }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="github_username=${{ github.actor }}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Fail if Plan Errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Upload Plan Artifact
        if: steps.plan.outputs.exitcode != '1'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 5

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`;
            const body = `### Terraform Plan

            \`\`\`
            ${plan.substring(0, 60000)}
            \`\`\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == '2')
    defaults:
      run:
        working-directory: terraform
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write OCI API Key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Output Instance Details
        run: |
          echo "## Terraform Apply Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Public IP**: $(terraform output -raw instance_public_ip)" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH**: $(terraform output -raw ssh_connection_string)" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance ID**: $(terraform output -raw instance_id)" >> $GITHUB_STEP_SUMMARY

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: terraform
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write OCI API Key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var="oci_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -var="oci_user_ocid=${{ secrets.OCI_USER_OCID }}" \
            -var="oci_fingerprint=${{ secrets.OCI_FINGERPRINT }}" \
            -var="oci_private_key_path=/home/runner/.oci/oci_api_key.pem" \
            -var="compartment_ocid=${{ secrets.COMPARTMENT_OCID }}" \
            -var="oci_region=${{ secrets.OCI_REGION }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="github_username=${{ github.actor }}" \
            -auto-approve
