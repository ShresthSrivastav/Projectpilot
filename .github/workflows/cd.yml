name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"
        type: string
      skip-tests:
        description: "Skip test step"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shresthsrivastav/projectpilot

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip-tests != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        include:
          - python-version: "3.12"
            continue-on-error: true
          - python-version: "3.11"
            continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov pytest-asyncio pytest-timeout

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Tests with Coverage
        env:
          CHROMA_PATH: ./test_chroma_ci
          GENERATED_PROJECTS_DIR: ./test_generated_ci
          OLLAMA_BASE_URL: http://localhost:11434
          ZIP_RETENTION_HOURS: "1"
          ADMIN_API_KEY: test-admin-key-123
          USER_API_KEY: test-user-key-456
          RATE_LIMIT_ENABLED: "false"
          SKIP_AUTH: "true"
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term -v --tb=short --no-header --timeout=120

      - name: Clean up Test Artifacts
        if: always()
        run: |
          rm -rf test_chroma_ci test_generated_ci test_chroma_data_v4 test_generated_projects_v4

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ always() && (success() || github.event.inputs.skip-tests == 'true') }}

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag-short: ${{ steps.meta.outputs.version }}
      frontend-tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata for frontend-next
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-next
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push frontend-next
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-next
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend-next Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-next\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend-next Tags**: ${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend-next Digest**: ${{ steps.build-frontend.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: linux/amd64,linux/arm64" >> $GITHUB_STEP_SUMMARY

  check-secrets:
    name: Check Deployment Secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check OCI secrets
        id: check
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          if [ -n "$OCI_HOST" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to OCI Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean target directories on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo chattr -i /opt/projectpilot/docker-compose.prod.yml 2>/dev/null || true

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: "scripts/deploy.sh,docker-compose.prod.yml,.env.example"
          target: /opt/projectpilot/
          strip_components: 0

      - name: Deploy to OCI VM
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            chmod +x /opt/projectpilot/scripts/deploy.sh
            cp -n /opt/projectpilot/.env.example /opt/projectpilot/.env 2>/dev/null || true
            if grep -q '^GOOGLE_API_KEY=' /opt/projectpilot/.env; then
              sed -i 's|^GOOGLE_API_KEY=.*|GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}|' /opt/projectpilot/.env
            else
              echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> /opt/projectpilot/.env
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
            export DEPLOY_TIMEOUT="300"
            export FRONTEND_TAG="${{ needs.docker-build.outputs.frontend-tag }}"
            /opt/projectpilot/scripts/deploy.sh "${{ inputs.tag || 'latest' }}"

      - name: Public Health Check
        if: success()
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -sf "http://${OCI_HOST}/health" > /dev/null 2>&1; then
              echo "Public endpoint healthy at http://${OCI_HOST}/health"
              exit 0
            fi
            sleep 10
          done
          echo "Public endpoint not reachable (but container may be healthy behind nginx)"
          exit 0

      - name: Notify Deployment Result
        if: always()
        run: |
          echo "## Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.docker-build.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ needs.docker-build.outputs.image-digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }} (${{ github.ref }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
