name: Docker Build Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "backend/**"
      - "services/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "backend/**"
      - "services/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: projectpilot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1
