name: Future Self-Healing Hook

on:
  workflow_run:
    workflows: ["ProjectPilot CI"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  on-failure:
    name: Log CI Failure & Collect Context
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Analyze CI Failure logs
        run: |
          python scripts/failure_analyzer.py \
            --run-id ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output-dir failure_artifacts

      - name: Upload Failure Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report-${{ github.event.workflow_run.id }}
          path: failure_artifacts/
          retention-days: 14
