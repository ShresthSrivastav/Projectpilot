name: Deploy to OCI

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /opt/projectpilot

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set image tag
            TAG="${{ inputs.tag || 'latest' }}"
            export IMAGE_TAG=$TAG

            # Pull latest image
            docker pull ghcr.io/shresthsrivastav/projectpilot:$TAG

            # Create .env file if not exists
            if [ ! -f .env ]; then
              cat > .env << 'ENVEOF'
            ${{ secrets.OCI_ENV_FILE }}
            ENVEOF
            fi

            # Pull and recreate containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # Clean up old images
            docker image prune -af --filter "until=24h"

      - name: Health Check
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://${{ secrets.OCI_HOST }}:8000/health" > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Backend failed to start"
          exit 1
