name: ProjectPilot CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov pytest-asyncio

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Tests with Coverage
        env:
          CHROMA_PATH: ./test_chroma_ci
          GENERATED_PROJECTS_DIR: ./test_generated_ci
          OLLAMA_BASE_URL: http://localhost:11434
          ZIP_RETENTION_HOURS: "1"
          ADMIN_API_KEY: test-admin-key-123
          USER_API_KEY: test-user-key-456
          RATE_LIMIT_ENABLED: "false"
          SKIP_AUTH: "true"
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term -v --tb=short --no-header

      - name: Clean up Test Artifacts
        if: always()
        run: |
          rm -rf test_chroma_ci test_generated_ci test_chroma_data_v4 test_generated_projects_v4

      - name: Upload Test Coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
