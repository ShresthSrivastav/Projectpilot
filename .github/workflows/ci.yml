name: ProjectPilot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          CHROMA_PATH: ./test_chroma_ci
          GENERATED_PROJECTS_DIR: ./test_generated_ci
          ZIP_RETENTION_HOURS: "1"
        run: |
          python -m pytest tests/ -v --tb=short --no-header

      - name: Cleanup test artifacts
        if: always()
        run: |
          rm -rf test_chroma_ci test_generated_ci test_chroma_data_v4 test_generated_projects_v4
