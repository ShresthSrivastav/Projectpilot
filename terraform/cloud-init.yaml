#cloud-config
# ProjectPilot Production Server Configuration

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-plugin
  - git
  - nginx
  - certbot
  - python3-certbot-nginx
  - fail2ban
  - ufw
  - curl
  - jq
  - logrotate

users:
  - name: deploy
    groups: sudo, docker
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys: []

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "default-ulimits": {
          "nofile": {
            "Name": "nofile",
            "Hard": 65536,
            "Soft": 65536
          }
        }
      }
    permissions: '0644'

  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 3600
      findtime = 600
      maxretry = 5
      backend  = systemd

      [sshd]
      enabled = true
      port    = 22
      logpath = /var/log/auth.log
      maxretry = 3

      [nginx-http-auth]
      enabled = true
      port    = http,https
      logpath = /var/log/nginx/error.log

      [nginx-limit-req]
      enabled = true
      port    = http,https
      logpath = /var/log/nginx/error.log
    permissions: '0644'

  - path: /etc/nginx/conf.d/security-headers.conf
    content: |
      # Security headers applied globally
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    permissions: '0644'

  - path: /etc/logrotate.d/projectpilot
    content: |
      /var/log/projectpilot/*.log {
          daily
          missingok
          rotate 14
          compress
          delaycompress
          notifempty
          create 0640 deploy deploy
          sharedscripts
          postrotate
              systemctl reload nginx > /dev/null 2>&1 || true
          endscript
      }
    permissions: '0644'

  - path: /etc/systemd/system/projectpilot.service
    content: |
      [Unit]
      Description=ProjectPilot Application
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/projectpilot
      User=deploy
      Group=deploy
      ExecStartPre=/usr/bin/docker compose -f docker-compose.prod.yml pull
      ExecStart=/usr/bin/docker compose -f docker-compose.prod.yml up -d --remove-orphans
      ExecStop=/usr/bin/docker compose -f docker-compose.prod.yml down
      ExecReload=/usr/bin/docker compose -f docker-compose.prod.yml up -d --force-recreate
      TimeoutStartSec=300
      TimeoutStopSec=120

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

  - path: /etc/nginx/sites-available/projectpilot.conf
    content: |
      upstream projectpilot_backend {
          least_conn;
          server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
      }

      upstream projectpilot_frontend {
          least_conn;
          server 127.0.0.1:8501 max_fails=3 fail_timeout=30s;
      }

      # Rate limiting zones
      limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
      limit_req_zone $binary_remote_addr zone=frontend:10m rate=30r/s;
      limit_conn_zone $binary_remote_addr zone=connlimit:10m;

      # HTTP -> HTTPS redirect
      server {
          listen 80;
          listen [::]:80;
          server_name ${domain_name} _;

          # Allow Let's Encrypt ACME challenge
          location /.well-known/acme-challenge/ {
              root /var/www/certbot;
          }

          location / {
              return 301 https://$host$request_uri;
          }
      }

      # HTTPS server
      server {
          listen 443 ssl http2;
          listen [::]:443 ssl http2;
          server_name ${domain_name};

          ssl_certificate /etc/letsencrypt/live/${domain_name}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/${domain_name}/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
          ssl_prefer_server_ciphers off;
          ssl_session_timeout 1d;
          ssl_session_cache shared:SSL:10m;
          ssl_session_tickets off;
          ssl_stapling on;
          ssl_stapling_verify on;

          # HSTS
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

          # Security headers (from conf.d)
          include /etc/nginx/conf.d/security-headers.conf;

          # Gzip compression
          gzip on;
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 6;
          gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

          # Connection limits
          limit_conn connlimit 50;

          # Client body size
          client_max_body_size 50M;

          # API backend
          location /api/ {
              limit_req zone=api burst=20 nodelay;
              proxy_pass http://projectpilot_backend/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Request-ID $request_id;
              proxy_connect_timeout 30s;
              proxy_send_timeout 60s;
              proxy_read_timeout 120s;
              proxy_buffering on;
              proxy_buffer_size 8k;
              proxy_buffers 8 8k;
          }

          # Backend API (direct access)
          location ~ ^/(health|docs|openapi.json|redoc) {
              proxy_pass http://projectpilot_backend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # FastAPI specific endpoints
          location /generate-project {
              limit_req zone=api burst=5 nodelay;
              proxy_pass http://projectpilot_backend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
          }

          location /clarify {
              limit_req zone=api burst=5 nodelay;
              proxy_pass http://projectpilot_backend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # WebSocket support for live updates
          location /ws/ {
              proxy_pass http://projectpilot_backend;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 86400;
              proxy_send_timeout 86400;
          }

          # Frontend (Streamlit)
          location / {
              limit_req zone=frontend burst=50 nodelay;
              proxy_pass http://projectpilot_frontend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Request-ID $request_id;

              # WebSocket support for Streamlit
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 86400;
              proxy_send_timeout 86400;
          }

          # Static assets caching
          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
              proxy_pass http://projectpilot_frontend;
              proxy_set_header Host $host;
              expires 7d;
              add_header Cache-Control "public, immutable";
          }

          # Health check endpoint
          location /nginx-health {
              access_log off;
              return 200 "healthy\n";
              add_header Content-Type text/plain;
          }
      }
    permissions: '0644'

runcmd:
  # Enable and start Docker
  - systemctl enable docker
  - systemctl start docker

  # Add deploy user to docker group
  - usermod -aG docker deploy

  # Configure UFW
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Enable automatic security updates
  - dpkg-reconfigure -f noninteractive unattended-upgrades

  # Create deployment directories
  - mkdir -p /opt/projectpilot
  - mkdir -p /opt/projectpilot/data/chroma_data
  - mkdir -p /opt/projectpilot/data/generated_projects
  - mkdir -p /opt/projectpilot/data/memory_store
  - mkdir -p /opt/projectpilot/logs
  - mkdir -p /var/log/projectpilot
  - mkdir -p /var/www/certbot
  - chown -R deploy:deploy /opt/projectpilot

  # Enable Nginx
  - systemctl enable nginx
  - systemctl start nginx

  # Log rotation
  - logrotate -f /etc/logrotate.d/projectpilot

final_message: "ProjectPilot server setup complete after $UPTIME seconds"
